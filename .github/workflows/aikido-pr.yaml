name: aikido-pr

# One Aikido scan per pull request. The scan arguments are that PR's base
# commit and head commit, and the concurrency group is the PR number, so a
# push to one PR never reuses or cancels another PR's scan.
on:
  pull_request:

permissions: {}

concurrency:
  group: aikido-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  aikido-pr:
    # Fork pull requests do not receive Actions secrets. Those PRs are covered
    # by the Aikido PR Checks GitHub app, which scans each PR without this key.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Install Socket Firewall
        uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
          firewall-version: "1.15.6"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install Aikido CI client
        # zizmor: ignore[adhoc-packages] pinned Aikido CI client for this pull request scan
        run: sfw npm install --global @aikidosec/ci-api-client@1.0.22

      - name: Scan this pull request
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          AIKIDO_CLIENT_API_KEY: ${{ secrets.AIKIDO_CLIENT_API_KEY }}
        run: |
          if [ -z "$AIKIDO_CLIENT_API_KEY" ]; then
            echo "AIKIDO_CLIENT_API_KEY is not set."
            echo "Create it in Aikido → Integrations → Continuous Integration, then add it as an Actions secret."
            exit 1
          fi
          aikido-api-client scan "$REPO_NAME" "$BASE_SHA" "$HEAD_SHA" "$HEAD_REF" \
            --apikey "$AIKIDO_CLIENT_API_KEY" \
            --pull-request-title "$PR_TITLE" \
            --pull-request-url "$PR_URL" \
            --fail-on-sast-scan \
            --fail-on-iac-scan \
            --fail-on-secrets-scan
